model:
   model_path: ../../stm32ai-modelzoo-services/image_classification/tf/src/experiments_outputs/2026_02_26_11_47_42/saved_models/best_model.keras
operation_mode: quantization

dataset:
  dataset_name: custom_dataset
  quantization_path: /Users/maksym.solovianchyk/Downloads/vehicle-10

preprocessing:
   rescaling:
      scale: 1/127.5
      offset: -1
   resizing:
      aspect_ratio: fit
      interpolation: nearest
   color_mode: rgb

quantization:
   quantizer: TFlite_converter
   quantization_type: PTQ
   quantization_input_type: uint8
   quantization_output_type: int8
   export_dir: quantized_models

mlflow:
   uri: ./tf/src/experiments_outputs/mlruns

hydra:
   run:
      dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
