general:
  project_name: training_test
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: true
  global_seed: 127
  gpu_memory_limit: 3
operation_mode: training
model:
  model_name: mobilenetv2_a035
  input_shape: (224, 224, 3)
  pretrained: true
dataset:
  dataset_name: custom_dataset
  class_names:
  - bicycle
  - car
  training_path: /Users/maksym.solovianchyk/Downloads/vehicle-10
  validation_path: null
  validation_split: 0.15
  test_path: null
preprocessing:
  rescaling:
    scale: 1/127.5
    offset: -1
  resizing:
    aspect_ratio: fit
    interpolation: nearest
  color_mode: rgb
data_augmentation:
  random_contrast:
    factor: 0.4
  random_brightness:
    factor: 0.2
  random_flip:
    mode: horizontal_and_vertical
  random_translation:
    width_factor: 0.2
    height_factor: 0.2
  random_rotation:
    factor: 0.15
  random_zoom:
    width_factor: 0.25
    height_factor: 0.25
training:
  batch_size: 64
  epochs: 200
  dropout: 0.3
  optimizer:
    Adam:
      learning_rate: 0.001
  callbacks:
    ReduceLROnPlateau:
      monitor: val_accuracy
      factor: 0.5
      patience: 10
    EarlyStopping:
      monitor: val_accuracy
      patience: 30
mlflow:
  uri: ./tf/src/experiments_outputs/mlruns
